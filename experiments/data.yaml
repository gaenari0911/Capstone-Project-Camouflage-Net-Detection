# 학습을 실행하는 스크립트(train.py) 위치를 기준으로 한 상대 경로 
path: ../datasets/acd1k  # 데이터셋 루트 디렉토리

train: train/images      # 학습 이미지 폴더 (path 기준 상대 경로)
val: val/images          # 검증 이미지 폴더 (path 기준 상대 경로)

# 클래스 정보 설정
nc: 1                    # Number of Classes (클래스 개수)
names:
  0: camouflaged_object  # 0번 클래스의 이름